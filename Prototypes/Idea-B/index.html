<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Forge Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #f39c12, #f1c40f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #f39c12;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            height: fit-content;
        }

        .resources {
            margin-top: 20px;
        }

        .resource-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            border-left: 3px solid #f39c12;
        }

        .resource-name {
            font-weight: 500;
        }

        .resource-count {
            color: #f39c12;
            font-weight: bold;
        }

        .gather-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gather-btn:hover {
            transform: scale(1.05);
        }

        .gather-btn:active {
            transform: scale(0.95);
        }

        .stations {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .station-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .station-name {
            font-size: 1.3em;
            font-weight: bold;
        }

        .station-level {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
        }

        .recipe-select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #eee;
            font-size: 1em;
        }

        .craft-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .craft-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .craft-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            margin-top: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .queue {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .queue-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .quality-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-left: 8px;
        }

        .q0 {
            background: #95a5a6;
        }

        .q1 {
            background: #2ecc71;
        }

        .q2 {
            background: #3498db;
        }

        .q3 {
            background: #9b59b6;
        }

        .message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            background: rgba(46, 204, 113, 0.9);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>⚒️ The Forge Dashboard</h1>
            <p>Fulfill orders and mine resources!</p>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Gold</div>
                    <div class="stat-value" id="gold">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Mining Energy</div>
                    <div class="stat-value" id="energy">100/100</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Orders Done</div>
                    <div class="stat-value" id="ordersCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Items Crafted</div>
                    <div class="stat-value" id="totalCrafted">0</div>
                </div>
            </div>
        </header>

        <div class="dashboard">
            <div class="sidebar">
                <h2>Resources</h2>
                <div class="resources" id="resources"></div>
                <button class="gather-btn" onclick="startMining()">⛏️ MINE ORE (10 Energy)</button>

                <h2 style="margin-top:30px;">Active Orders</h2>
                <div id="orders-panel" style="margin-top:10px;"></div>
            </div>

            <div class="stations" id="stations"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
