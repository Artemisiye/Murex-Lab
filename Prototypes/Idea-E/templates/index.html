<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Artificer's Codex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #ecf0f1;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(236, 240, 241, 0.05);
            border-radius: 15px;
            border: 2px solid rgba(236, 240, 241, 0.1);
        }

        h1 {
            font-size: 3em;
            color: #f39c12;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-style: italic;
            opacity: 0.8;
            font-size: 1.2em;
        }

        .workbench {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .components-panel {
            background: rgba(236, 240, 241, 0.05);
            padding: 25px;
            border-radius: 10px;
            border: 2px solid rgba(236, 240, 241, 0.1);
        }

        .component-group {
            margin-bottom: 25px;
        }

        .component-group h3 {
            color: #f39c12;
            margin-bottom: 12px;
            font-size: 1.3em;
            border-bottom: 1px solid rgba(243, 156, 18, 0.3);
            padding-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: rgba(52, 73, 94, 0.8);
            border: 2px solid rgba(236, 240, 241, 0.2);
            border-radius: 5px;
            color: #ecf0f1;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover {
            border-color: #f39c12;
        }

        select option {
            background: #34495e;
            padding: 10px;
        }

        .craft-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #f39c12, #e67e22);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
        }

        .craft-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.5);
        }

        .stats-panel {
            background: rgba(236, 240, 241, 0.05);
            padding: 25px;
            border-radius: 10px;
            border: 2px solid rgba(236, 240, 241, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(52, 73, 94, 0.6);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #f39c12;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateX(5px);
            background: rgba(52, 73, 94, 0.8);
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #f39c12;
        }

        .stat-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            transition: width 0.5s ease;
        }

        .component-details {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(236, 240, 241, 0.1);
        }

        .component-detail {
            background: rgba(52, 73, 94, 0.4);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .component-name {
            font-weight: bold;
            color: #3498db;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .component-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 0.9em;
            opacity: 0.9;
        }

        .set-bonus {
            background: linear-gradient(45deg, #9b59b6, #8e44ad);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
            display: none;
        }

        .set-bonus.active {
            display: block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.02);
            }
        }

        .builds-section {
            margin-top: 40px;
            background: rgba(236, 240, 241, 0.05);
            padding: 25px;
            border-radius: 10px;
            border: 2px solid rgba(236, 240, 241, 0.1);
        }

        .save-build-btn {
            padding: 10px 20px;
            background: #27ae60;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin-top: 15px;
        }

        .builds-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .build-card {
            background: rgba(52, 73, 94, 0.6);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }

        .build-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
            color: #3498db;
        }

        .build-score {
            font-size: 1.5em;
            color: #f39c12;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>📜 The Artificer's Codex</h1>
            <p class="subtitle">Master the art of weapon assembly</p>
            <div id="gold-display" style="margin-top:20px; color:#f1c40f; font-size:1.5em; font-weight:bold;">
                💰 Gold: 0
            </div>
        </header>

        <div class="quests-section" style="margin-bottom: 30px;">
            <h2>📜 Active Quests</h2>
            <div id="quests-list"
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-top: 15px;">
                <!-- Quests loaded via JS -->
            </div>
        </div>

        <div class="workbench">
            <div class="components-panel">
                <h2>Component Selection</h2>

                <div class="component-group">
                    <h3>🪵 Handle</h3>
                    <select id="handle-select">
                        <option value="">Choose Handle...</option>
                        {% for handle in components.handles %}
                        <option value="{{ handle.id }}">{{ handle.name }} ({{ handle.material }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="component-group">
                    <h3>⚔️ Blade</h3>
                    <select id="blade-select">
                        <option value="">Choose Blade...</option>
                        {% for blade in components.blades %}
                        <option value="{{ blade.id }}">{{ blade.name }} ({{ blade.material }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="component-group">
                    <h3>🛡️ Guard</h3>
                    <select id="guard-select">
                        <option value="">Choose Guard...</option>
                        {% for guard in components.guards %}
                        <option value="{{ guard.id }}">{{ guard.name }} ({{ guard.material }})</option>
                        {% endfor %}
                    </select>
                </div>

                <button class="craft-button" onclick="calculateStats()">
                    ⚒️ Calculate Weapon Stats
                </button>

                <button class="save-build-btn" onclick="saveBuild()" id="save-btn" style="display: none;">
                    💾 Save This Build
                </button>
            </div>

            <div class="stats-panel">
                <h2>Weapon Statistics</h2>
                <div class="stats-grid" id="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Select components to view stats</div>
                    </div>
                </div>

                <div id="set-bonus" class="set-bonus">
                    ⭐ SET BONUS ACTIVE: +15% All Stats ⭐
                </div>

                <div class="component-details" id="component-details" style="display: none;">
                    <h3>Component Breakdown</h3>
                    <div id="details-content"></div>
                </div>
            </div>
        </div>

        <div class="builds-section">
            <h2>Saved Builds</h2>
            <div class="builds-list" id="builds-list"></div>
        </div>
    </div>

    <script>
        let currentStats = null;
        let currentComponents = null;
        let unlockedComponents = null;

        async function init() {
            await loadPlayerComponents();
            await loadQuests();
            await loadBuilds();
        }

        async function loadPlayerComponents() {
            const response = await fetch('/player_components');
            const data = await response.json();
            unlockedComponents = data.components;
            updateComponentSelects();
        }

        function updateComponentSelects() {
            if (!unlockedComponents) return;

            ['handle', 'blade', 'guard'].forEach(type => {
                const select = document.getElementById(`${type}-select`);
                const options = select.options;
                const typePlural = type + (type === 'blade' ? 's' : type === 'guard' ? 's' : 's');
                const unlockedSet = new Set(unlockedComponents[typePlural] || unlockedComponents[type + 's']);

                for (let i = 0; i < options.length; i++) {
                    const opt = options[i];
                    if (opt.value) {
                        if (unlockedSet.has(opt.value)) {
                            opt.disabled = false;
                            opt.text = opt.text.replace(' 🔒', '');
                        } else {
                            opt.disabled = true;
                            if (!opt.text.includes('🔒')) opt.text += ' 🔒';
                        }
                    }
                }
            });
        }

        async function loadQuests() {
            const response = await fetch('/quests');
            const data = await response.json();

            const questsList = document.getElementById('quests-list');
            if (data.quests.length === 0) {
                questsList.innerHTML = '<div style="padding:20px; background:rgba(255,255,255,0.05); border-radius:8px;">No active quests.</div>';
                return;
            }

            questsList.innerHTML = data.quests.map(quest => {
                const constraints = Object.entries(quest.constraints)
                    .map(([k, v]) => `<div>- ${k.replace(/_/g, ' ')}: ${v}</div>`)
                    .join('');

                return `
                <div class="quest-card" style="background: rgba(52, 73, 94, 0.6); padding: 15px; border-radius: 8px; border-left: 4px solid #f1c40f;">
                    <h3 style="color:#f1c40f; margin-bottom:5px;">${quest.hero}'s Request</h3>
                    <div style="font-size:0.9em; opacity:0.8; margin-bottom:10px;">Reward: ${quest.gold}g + Component Unlock</div>
                    <div style="background:rgba(0,0,0,0.2); padding:10px; border-radius:5px; margin-bottom:10px; font-size:0.9em;">
                        <strong>Requirements:</strong>
                        ${constraints}
                    </div>
                    <button onclick="submitQuest(${quest.id})" style="width:100%; padding:8px; background:#27ae60; border:none; color:white; border-radius:4px; cursor:pointer;">
                        Submit Current Build
                    </button>
                </div>`;
            }).join('');
        }

        async function submitQuest(questId) {
            if (!currentStats) {
                alert('Please build and calculate a weapon first!');
                return;
            }

            const response = await fetch('/submit_quest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    quest_id: questId,
                    stats: currentStats
                })
            });

            const result = await response.json();
            if (result.success) {
                alert(result.message);
                const goldDisplay = document.getElementById('gold-display');
                if (goldDisplay) goldDisplay.innerHTML = `💰 Gold: ${result.gold}`;
                await loadPlayerComponents();
                await loadQuests();
            } else {
                alert('Quest Failed:\n' + result.failures.join('\n'));
            }
        }

        async function calculateStats() {
            const handle = document.getElementById('handle-select').value;
            const blade = document.getElementById('blade-select').value;
            const guard = document.getElementById('guard-select').value;

            if (!handle || !blade || !guard) {
                alert('Please select all components');
                return;
            }

            const response = await fetch('/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ handle, blade, guard })
            });

            const data = await response.json();
            currentStats = data.stats;
            currentComponents = data.components;

            displayStats(data.stats, data.components);
            document.getElementById('save-btn').style.display = 'block';
        }

        function displayStats(stats, components) {
            const grid = document.getElementById('stats-grid');
            grid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">⚖️ Weight</div>
                    <div class="stat-value">${stats.weight} kg</div>
                    <div class="stat-bar"><div class="stat-bar-fill" style="width: ${Math.min(stats.weight * 20, 100)}%"></div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">⚡ Attack Speed</div>
                    <div class="stat-value">${stats.attack_speed}</div>
                    <div class="stat-bar"><div class="stat-bar-fill" style="width: ${stats.attack_speed}%"></div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">⚔️ Damage</div>
                    <div class="stat-value">${stats.damage}</div>
                    <div class="stat-bar"><div class="stat-bar-fill" style="width: ${Math.min(stats.damage * 4, 100)}%"></div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">🔧 Balance</div>
                    <div class="stat-value">${stats.balance}</div>
                    <div class="stat-bar"><div class="stat-bar-fill" style="width: ${stats.balance * 10}%"></div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">🛡️ Durability</div>
                    <div class="stat-value">${stats.durability}</div>
                    <div class="stat-bar"><div class="stat-bar-fill" style="width: ${stats.durability}%"></div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">📏 Reach</div>
                    <div class="stat-value">${stats.reach}m</div>
                    <div class="stat-bar"><div class="stat-bar-fill" style="width: ${stats.reach * 10}%"></div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">🗡️ Sharpness</div>
                    <div class="stat-value">${stats.sharpness}</div>
                    <div class="stat-bar"><div class="stat-bar-fill" style="width: ${stats.sharpness * 10}%"></div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">⭐ Total Score</div>
                    <div class="stat-value">${stats.total_score}</div>
                    <div class="stat-bar"><div class="stat-bar-fill" style="width: ${Math.min(stats.total_score / 2, 100)}%"></div></div>
                </div>
            `;

            const setBonus = document.getElementById('set-bonus');
            if (stats.set_bonus > 0) {
                setBonus.classList.add('active');
            } else {
                setBonus.classList.remove('active');
            }

            const details = document.getElementById('component-details');
            details.style.display = 'block';

            const detailsContent = document.getElementById('details-content');
            detailsContent.innerHTML = `
                <div class="component-detail">
                    <div class="component-name">🪵 ${components.handle.name}</div>
                    <div class="component-stats">
                        <div>Weight: ${components.handle.weight}kg</div>
                        <div>Comfort: ${components.handle.comfort}</div>
                        <div>Durability: ${components.handle.durability}</div>
                    </div>
                </div>
                <div class="component-detail">
                    <div class="component-name">⚔️ ${components.blade.name}</div>
                    <div class="component-stats">
                        <div>Weight: ${components.blade.weight}kg</div>
                        <div>Damage: ${components.blade.damage}</div>
                        <div>Sharpness: ${components.blade.sharpness}</div>
                    </div>
                </div>
                <div class="component-detail">
                    <div class="component-name">🛡️ ${components.guard.name}</div>
                    <div class="component-stats">
                        <div>Weight: ${components.guard.weight}kg</div>
                        <div>Defense: ${components.guard.defense}</div>
                        <div>Balance: ${components.guard.balance}</div>
                    </div>
                </div>
            `;
        }

        async function saveBuild() {
            const name = prompt('Name this build:');
            if (!name) return;

            await fetch('/save_build', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name,
                    components: currentComponents,
                    stats: currentStats
                })
            });

            loadBuilds();
        }

        async function loadBuilds() {
            const response = await fetch('/builds');
            const data = await response.json();

            const buildsList = document.getElementById('builds-list');
            buildsList.innerHTML = data.builds.map(build => `
                <div class="build-card">
                    <div class="build-name">${build.name}</div>
                    <div class="build-score">Score: ${build.stats.total_score}</div>
                    <div style="margin-top: 10px; font-size: 0.9em; opacity: 0.8;">
                        Damage: ${build.stats.damage} | Speed: ${build.stats.attack_speed}
                    </div>
                </div>
            `).join('');
        }

        init();
    </script>
</body>

</html>
