<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murex Lab</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">MUREX LAB</div>
            <ul class="nav-links">
                <li class="active" data-view="workshop">⚒️ Workshop</li>
                <li data-view="inventory">🎒 Inventory</li>
                <li data-view="map">🗺️ Map</li>
                <li data-view="orders">📜 Orders</li>
                <li data-view="minions">👥 Minions</li>
                <li data-view="research">⚗️ Research</li>
            </ul>
            <div class="player-status">
                <div class="gold">💰 0 Gold</div>
                <div class="date">📅 Day 1</div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-view">
            <header>
                <h1 id="view-title">Workshop</h1>
            </header>

            <div id="content-area">
                <div class="placeholder-message">
                    <h2>Systems Online</h2>
                    <p>Welcome, Artificer. The lab is ready for calibration.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Global Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modal-title">Notification</h2>
            <div id="modal-body" class="modal-body"></div>
            <div class="modal-actions">
                <button id="modal-close" class="action-btn">Understood</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
