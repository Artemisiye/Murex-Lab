<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Murex</title>
    <style>
        body {
            font-family: sans-serif;
            background: #222;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            /* Make it feel like an app, not a web page */
        }

        h1 {
            color: #f39c12;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2em;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        #response {
            margin-top: 20px;
            color: #2ecc71;
            height: 30px;
        }
    </style>
</head>

<body>
    <h1>👋 Hello World</h1>
    <p>This is a Flask app running in a native window.</p>

    <button onclick="callPython()">Call Python</button>
    <div id="response"></div>

    <script>
        async function callPython() {
            // Standard fetch to the local flask server
            const res = await fetch('/click');
            const text = await res.text();
            document.getElementById('response').innerText = text;
        }
    </script>
</body>

</html>
