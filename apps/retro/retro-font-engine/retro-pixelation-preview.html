<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel Art Typography</title>
    <!-- Importing Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Roboto+Mono:wght@400;700&family=Inter:wght@400;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        canvas {
            image-rendering: pixelated;
            background: #fff;
            border: 4px solid #000;
            box-shadow: 12px 12px 0px 0px rgba(0, 0, 0, 0.1);
        }

        .panel {
            background: #ffffff;
            border: 2px solid #000;
            padding: 1rem;
            box-shadow: 4px 4px 0px 0px #000;
        }

        .panel-title {
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            border-bottom: 2px solid #000;
            margin-bottom: 1rem;
            padding-bottom: 0.25rem;
            display: flex;
            justify-content: space-between;
        }

        label {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.65rem;
            display: block;
            margin-bottom: 0.25rem;
        }

        input[type="range"] {
            accent-color: #000;
            width: 100%;
            height: 4px;
        }

        select,
        input[type="text"] {
            border: 2px solid #000;
            padding: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            outline: none;
            width: 100%;
        }

        .control-group {
            margin-bottom: 1rem;
        }

        .value-badge {
            font-family: monospace;
            background: #000;
            color: #fff;
            padding: 0 4px;
            font-size: 0.65rem;
        }
    </style>
</head>

<body class="p-6 min-h-screen flex flex-col items-center">

    <div class="max-w-6xl w-full space-y-8">
        <header class="flex justify-between items-end border-b-4 border-black pb-4">
            <div>
                <h1 class="text-4xl font-black uppercase tracking-tighter">Quantized Sprite Engine v5.4</h1>
                <p class="text-gray-500 font-bold text-xs">Diagnostic Pipeline: Buffer → Raster → Quant → Frame</p>
            </div>
            <div class="absolute top-4 right-4 flex space-x-2">
                <select id="themeSelect" class="bg-white border-2 border-black text-[10px] font-bold p-1">
                    <option value="classic">Fantasy RPG</option>
                    <option value="sky">Azure Sky</option>
                    <option value="monochrome">B&W Diagnostic</option>
                </select>
            </div>
        </header>

        <!-- Preview Area -->
        <div
            class="flex justify-center bg-indigo-500 p-8 border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] relative">
            <canvas id="pixelCanvas" width="900" height="360" class="max-w-full h-auto"></canvas>
        </div>

        <!-- 4-Panel Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

            <!-- Panel 1: Buffer -->
            <div class="panel">
                <div class="panel-title">1. Buffer <span class="text-gray-400">High-Res</span></div>
                <div class="control-group">
                    <label>Sprite Text</label>
                    <input type="text" id="textInput" value="PIXEL ART"
                        class="bg-yellow-100 uppercase mb-2 border-2 border-black">
                </div>
                <div class="control-group">
                    <label>Font Family</label>
                    <select id="fontFamily">
                        <option value="Cinzel">Cinzel (Serif)</option>
                        <option value="'Roboto Mono'">Roboto Mono</option>
                        <option value="Inter">Inter (Sans)</option>
                        <option value="serif">System Serif</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Font Size <span class="value-badge" id="fontSizeVal">70</span></label>
                    <input type="range" id="fontSize" min="20" max="120" value="70">
                </div>
                <div class="control-group">
                    <label>Font Weight <span class="value-badge" id="fontWeightVal">900</span></label>
                    <input type="range" id="fontWeight" min="400" max="900" step="100" value="900">
                </div>
                <div class="control-group">
                    <label>Letter Spacing <span class="value-badge" id="fontSpacingVal">2</span></label>
                    <input type="range" id="fontSpacing" min="-10" max="40" value="2">
                </div>
                <div class="control-group">
                    <label>Ink Dilation <span class="value-badge" id="inkDilation1Val">1.5</span></label>
                    <input type="range" id="inkDilation1" min="0" max="10" step="0.1" value="1.5">
                </div>
            </div>

            <!-- Panel 2: Rasterization -->
            <div class="panel">
                <div class="panel-title">2. Raster <span class="text-gray-400">The Grid</span></div>
                <div class="control-group">
                    <label>Grid Size (Scale) <span class="value-badge" id="gridSizeVal">0.15</span></label>
                    <input type="range" id="gridSize" min="0.05" max="0.5" step="0.01" value="0.15">
                </div>
                <div class="control-group">
                    <label>Dilation Bias <span class="value-badge" id="inkDilation2Val">0.0</span></label>
                    <input type="range" id="inkDilation2" min="0" max="5" step="0.1" value="0">
                </div>
                <div
                    class="mt-8 p-2 bg-gray-100 border border-dashed border-gray-400 text-[9px] font-bold text-gray-500 leading-tight">
                    DOWN-SAMPLING THE VECTOR INK TO A LOW-RESOLUTION GRID BEFORE FX.
                </div>
            </div>

            <!-- Panel 3: Quantization -->
            <div class="panel">
                <div class="panel-title">3. Quantize <span class="text-gray-400">The Crunch</span></div>
                <div class="control-group">
                    <label>Threshold <span class="value-badge" id="quantThreshVal">128</span></label>
                    <input type="range" id="quantThresh" min="1" max="254" value="128">
                </div>
                <label class="flex items-center space-x-2 mt-4 cursor-pointer">
                    <input type="checkbox" id="enableQuant" checked class="w-4 h-4 accent-black">
                    <span class="text-[10px] font-bold">ENABLE CRUNCH</span>
                </label>
                <div
                    class="mt-4 p-2 bg-blue-50 border border-blue-200 text-[9px] font-bold text-blue-800 leading-tight">
                    POSTERIZES THE GRID INTO SOLID ON/OFF PIXELS.
                </div>
            </div>

            <!-- Panel 4: Frame -->
            <div class="panel">
                <div class="panel-title">4. Frame <span class="text-gray-400">Post-FX</span></div>
                <div class="control-group">
                    <label>Outline Thick <span class="value-badge" id="outThickVal">1</span></label>
                    <input type="range" id="outThick" min="0" max="4" value="1">
                </div>
                <div class="control-group">
                    <label>Shadow Distance <span class="value-badge" id="shDistVal">2</span></label>
                    <input type="range" id="shDist" min="0" max="8" value="2">
                </div>
                <div class="control-group">
                    <label>Shadow Size <span class="value-badge" id="shSizeVal">0</span></label>
                    <input type="range" id="shSize" min="0" max="4" value="0">
                </div>
                <button id="downloadBtn"
                    class="w-full bg-black text-white text-[10px] font-black p-2 mt-2 hover:bg-gray-800 uppercase shadow-[2px_2px_0px_0px_rgba(0,0,0,0.5)] active:shadow-none active:translate-x-[1px] active:translate-y-[1px] transition-all">
                    Export PNG
                </button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function () {
            const canvas = document.getElementById('pixelCanvas');
            const ctx = canvas.getContext('2d');

            const spriteBuffer = document.createElement('canvas');
            const sCtx = spriteBuffer.getContext('2d');

            const fxBuffer = document.createElement('canvas');
            const fCtx = fxBuffer.getContext('2d');

            const controls = {
                textInput: document.getElementById('textInput'),
                // Panel 1
                fontFamily: document.getElementById('fontFamily'),
                fontSize: document.getElementById('fontSize'),
                fontWeight: document.getElementById('fontWeight'),
                fontSpacing: document.getElementById('fontSpacing'),
                inkDilation1: document.getElementById('inkDilation1'),
                // Panel 2
                gridSize: document.getElementById('gridSize'),
                inkDilation2: document.getElementById('inkDilation2'),
                // Panel 3
                quantThresh: document.getElementById('quantThresh'),
                enableQuant: document.getElementById('enableQuant'),
                // Panel 4
                outThick: document.getElementById('outThick'),
                shDist: document.getElementById('shDist'),
                shSize: document.getElementById('shSize'),
                // Misc
                themeSelect: document.getElementById('themeSelect'),
                downloadBtn: document.getElementById('downloadBtn')
            };

            const themes = {
                classic: { bg: '#6366f1', text: '#fff9c4', outline: '#4e342e', shadow: '#2d1b18' },
                sky: { bg: '#38bdf8', text: '#ffffff', outline: '#0369a1', shadow: '#0c4a6e' },
                monochrome: { bg: '#cccccc', text: '#ffffff', outline: '#000000', shadow: '#333333' }
            };

            function draw() {
                // Sync labels - now using accurate keys that match ID naming conventions
                Object.keys(controls).forEach(key => {
                    const label = document.getElementById(key + 'Val');
                    if (label) label.innerText = controls[key].value;
                });

                const scale = parseFloat(controls.gridSize.value);
                const theme = themes[controls.themeSelect.value];

                spriteBuffer.width = Math.max(1, canvas.width * scale);
                spriteBuffer.height = Math.max(1, canvas.height * scale);
                fxBuffer.width = spriteBuffer.width;
                fxBuffer.height = spriteBuffer.height;

                const x = spriteBuffer.width / 2;
                const y = spriteBuffer.height / 2;

                sCtx.fillStyle = "white";
                sCtx.fillRect(0, 0, spriteBuffer.width, spriteBuffer.height);

                const fSize = parseInt(controls.fontSize.value) * scale;
                sCtx.font = `${controls.fontWeight.value} ${fSize}px ${controls.fontFamily.value}`;
                sCtx.textAlign = 'center';
                sCtx.textBaseline = 'middle';
                sCtx.letterSpacing = `${controls.fontSpacing.value * scale}px`;

                const textToRender = controls.textInput.value.toUpperCase();

                sCtx.fillStyle = "black";
                sCtx.fillText(textToRender, x, y);

                const totalDilation = parseFloat(controls.inkDilation1.value) + parseFloat(controls.inkDilation2.value);
                if (totalDilation > 0) {
                    sCtx.strokeStyle = "black";
                    sCtx.lineWidth = totalDilation * scale * 4;
                    sCtx.lineJoin = 'round';
                    sCtx.strokeText(textToRender, x, y);
                }

                if (controls.enableQuant.checked) {
                    const id = sCtx.getImageData(0, 0, spriteBuffer.width, spriteBuffer.height);
                    const d = id.data;
                    const thresh = parseInt(controls.quantThresh.value);
                    for (let i = 0; i < d.length; i += 4) {
                        const lum = (d[i] + d[i + 1] + d[i + 2]) / 3;
                        if (lum < (255 - thresh)) {
                            d[i] = 0; d[i + 1] = 0; d[i + 2] = 0; d[i + 3] = 255;
                        } else {
                            d[i + 3] = 0;
                        }
                    }
                    sCtx.putImageData(id, 0, 0);
                }

                ctx.imageSmoothingEnabled = false;
                ctx.fillStyle = theme.bg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                function drawLayer(color, ox = 0, oy = 0, thickness = 0) {
                    fCtx.clearRect(0, 0, fxBuffer.width, fxBuffer.height);
                    for (let i = -thickness; i <= thickness; i++) {
                        for (let j = -thickness; j <= thickness; j++) {
                            fCtx.drawImage(spriteBuffer, i, j);
                        }
                    }
                    fCtx.globalCompositeOperation = 'source-in';
                    fCtx.fillStyle = color;
                    fCtx.fillRect(0, 0, fxBuffer.width, fxBuffer.height);
                    fCtx.globalCompositeOperation = 'source-over';
                    ctx.drawImage(fxBuffer, 0, 0, fxBuffer.width, fxBuffer.height, ox * (1 / scale), oy * (1 / scale), canvas.width, canvas.height);
                }

                const shDist = parseInt(controls.shDist.value);
                const shSize = parseInt(controls.shSize.value);
                if (shDist > 0 || shSize > 0) {
                    drawLayer(theme.shadow, shDist, shDist, shSize);
                }

                const outThick = parseInt(controls.outThick.value);
                if (outThick > 0) {
                    drawLayer(theme.outline, 0, 0, outThick);
                }

                drawLayer(theme.text, 0, 0, 0);
            }

            // Bind listeners to all control elements
            Object.values(controls).forEach(el => {
                if (el && el.tagName !== 'BUTTON') {
                    el.addEventListener('input', draw);
                    el.addEventListener('change', draw);
                }
            });

            controls.downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.download = 'pixel-sprite.png';
                link.href = canvas.toDataURL();
                link.click();
            };

            // Font loading and initial render
            document.fonts.ready.then(draw);
            setTimeout(draw, 500);
        };
    </script>
</body>

</html>
