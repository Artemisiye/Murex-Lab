<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murex Lab [Retro Console]</title>
    <style>
        @font-face {
            font-family: 'Silkscreen';
            src: url('/static/fonts/silkscreen-400.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Cinzel';
            src: url('/static/fonts/cinzel-400.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Roboto Mono';
            src: url('/static/fonts/robotomono-400.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Inter';
            src: url('/static/fonts/inter-400.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Press Start 2P';
            src: url('/static/fonts/press-start-2p-400.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'VT323';
            src: url('/static/fonts/vt323-400.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'DotGothic16';
            src: url('/static/fonts/dotgothic16-400.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Share Tech Mono';
            src: url('/static/fonts/sharetechmono-400.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Perfect DOS VGA 437';
            src: url('/static/fonts/perfect-dos-vga-437.woff') format('woff');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Fixedsys Excelsior 3.01';
            src: url('/static/fonts/fixedsys-excelsior.woff') format('woff');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Minecraftia';
            src: url('/static/fonts/minecraftia.woff') format('woff');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Valmeria';
            src: url('/static/fonts/valmeria.woff') format('woff');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Oldbitz';
            src: url('/static/fonts/oldbitz.woff') format('woff');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Ithaca';
            src: url('/static/fonts/ithaca.woff') format('woff');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Tamzen';
            src: url('/static/fonts/tamzen.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Echo Pixel Garalde';
            src: url('/static/fonts/echo-pixel-garalde.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Echo Garalde TTF';
            src: url('/static/fonts/echo-pixel-garalde.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Echo Garalde OTF';
            src: url('/static/fonts/echo-pixel-garalde.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        html,
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            /* Disable browser font smoothing globally */
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            font-smooth: never;
            text-rendering: optimizeSpeed;
        }

        #virtual-console {
            display: block;
            background-color: #000000;
            cursor: crosshair;

            /* Strict Hardware Pixel Rendering */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
        }
    </style>
</head>

<body>
    <canvas id="virtual-console"></canvas>
    <!-- Core Engine -->
    <script src="{{ url_for('static', filename='retro/retro_core.js') }}"></script>
</body>

</html>
